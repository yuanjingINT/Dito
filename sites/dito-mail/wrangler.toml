name = "dito-mail"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# 关键：所有请求先过 Worker，避免 CF 静态资源层对未知路径直接吐可缓存的 404 兜底页
run_worker_first = true

[[kv_namespaces]]
binding = "MAIL_KV"
id = "0828cf1fc6974b2caa9abf30df2fe220"

[[routes]]
pattern = "get.dito.asia"
custom_domain = true
