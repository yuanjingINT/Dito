<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>dito promo — 1920x1080 @30fps</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0e14; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
/* =====================================================================
 * dito 蒂特 — 宣传片渲染器（确定性逐帧渲染，t 秒 → 一帧 1920x1080）
 * 设计语言 1:1 取自 https://dito.dito.asia
 *   --bg:#0a0e14 --panel:#131a26 --border:#1e2a3a --text:#d6e2f0
 *   --muted:#7d8ea3 --accent:#35d0ba --accent2:#6ee7b7
 * ===================================================================== */

const W = 1920, H = 1080, FPS = 30, DUR = 57.0;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

/* ---------- 调色板（与官网一致） ---------- */
const BG = "#0a0e14", BG2 = "#0f1520", PANEL = "#131a26", BORDER = "#1e2a3a";
const TEXT = "#d6e2f0", MUTED = "#7d8ea3", ACC = "#35d0ba", ACC2 = "#6ee7b7";
const RED = "#e06c75", DIM = "#54687f", PR = "#98c379", GREEN = "#28c840";
const MONO = '"JetBrains Mono","Noto Sans Mono CJK SC","JetBrains Maple Mono",monospace';
const SANS = '"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif';

/* ---------- 工具 ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const eoCubic = (x) => 1 - Math.pow(1 - x, 3);
const eiOut = eoCubic;
const lerp = (a, b, p) => a + (b - a) * p;
function hexRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mix(h1, h2, p) {
  const a = hexRgb(h1), b = hexRgb(h2);
  return `rgb(${Math.round(lerp(a[0], b[0], p))},${Math.round(lerp(a[1], b[1], p))},${Math.round(lerp(a[2], b[2], p))})`;
}
function rgba(h, a) { const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

/* 文本绘制：统一 save/restore，支持字距、发光 */
function text(str, x, y, o) {
  o = o || {};
  ctx.save();
  ctx.globalAlpha = (o.alpha == null ? 1 : o.alpha) * (ctx.globalAlpha <= 0.0001 && o.alpha != null ? o.alpha : ctx.globalAlpha);
  ctx.font = `${o.weight || 400} ${o.size || 20}px ${o.font === "sans" ? SANS : MONO}`;
  ctx.letterSpacing = o.ls != null ? o.ls + "px" : "0px";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.baseline || "alphabetic";
  if (o.glow) {
    ctx.shadowColor = rgba(o.glowColor || ACC, o.glowAlpha || 0.5);
    ctx.shadowBlur = o.glow || 0;
  }
  ctx.fillStyle = o.color || TEXT;
  ctx.fillText(str, x, y);
  ctx.restore();
}
function textWidth(str, o) {
  o = o || {};
  ctx.save();
  ctx.font = `${o.weight || 400} ${o.size || 20}px ${o.font === "sans" ? SANS : MONO}`;
  ctx.letterSpacing = o.ls != null ? o.ls + "px" : "0px";
  const w = ctx.measureText(str).width;
  ctx.restore();
  return w;
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function panel(x, y, w, h, r, fill, borderCol, opts) {
  opts = opts || {};
  ctx.save();
  if (opts.shadow) {
    ctx.shadowColor = "rgba(0,0,0," + (opts.shadowAlpha || 0.45) + ")";
    ctx.shadowBlur = opts.shadowBlur || 50;
    ctx.shadowOffsetY = opts.shadowY == null ? 18 : opts.shadowY;
  }
  ctx.fillStyle = fill;
  rr(x, y, w, h, r);
  ctx.fill();
  ctx.restore();
  if (borderCol) {
    ctx.save();
    ctx.strokeStyle = borderCol;
    ctx.lineWidth = 1;
    rr(x + 0.5, y + 0.5, w - 1, h - 1, r);
    ctx.stroke();
    ctx.restore();
  }
}
/* 上浮入场：返回 {p, dy, alpha} */
function rise(t, t0, dur) {
  const p = eoCubic(seg(t, t0, t0 + (dur || 0.6)));
  return { p, dy: (1 - p) * 38, alpha: p };
}
/* 光标（官网 .caret：1.1s steps 闪烁） */
function caretOn(t) { return (t % 1.1) < 0.55; }
function drawCaret(x, y, h, t, alpha) {
  if (!caretOn(t)) return;
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fillStyle = ACC;
  ctx.fillRect(x, y - h + 4, Math.round(h * 0.52), h - 4);
  ctx.restore();
}
/* 打字机：segs = [[color,text],...]，t∈[t0,t1] 线性出字；返回已显示的 segs 与末尾 x 偏移 */
function typedSegs(segs, t, t0, t1) {
  const total = segs.reduce((n, s) => n + s[1].length, 0);
  const n = Math.floor(total * seg(t, t0, t1) + 1e-6);
  const out = [];
  let used = 0, xHint = 0;
  for (const [c, s] of segs) {
    if (used >= n) break;
    const take = Math.min(s.length, n - used);
    out.push([c, s.slice(0, take)]);
    used += take;
  }
  return out;
}
function segsWidth(segs, size, weight) {
  return segs.reduce((w, s) => w + textWidth(s[1], { size, weight }), 0);
}
function drawSegs(segs, x, y, size, weight, alpha) {
  ctx.save();
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  let cx = x;
  for (const [c, s] of segs) {
    ctx.font = `${weight || 400} ${size}px ${MONO}`;
    ctx.fillStyle = c;
    ctx.fillText(s, cx, y);
    cx += ctx.measureText(s).width;
  }
  ctx.restore();
  return cx;
}
const PS1 = [[RED, "yuanjing@arch"], [" ", " "], [DIM, "~"], [" ", " "], [PR, "$"], [" ", " "]];

/* ---------- 背景：径向光晕 + 微粒 + 暗角 ---------- */
const rng = mulberry32(20260913);
const PARTS = [];
for (let i = 0; i < 26; i++) {
  PARTS.push({
    x: rng() * W, y: rng() * H, spd: 6 + rng() * 14, ph: rng() * Math.PI * 2,
    r: 1 + rng() * 2.2, a: 0.04 + rng() * 0.09, sway: 14 + rng() * 26,
  });
}
function drawBackground(t, energy) {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  // 顶部两团径向光（官网 header::before）
  let g1 = ctx.createRadialGradient(W * 0.22, 40, 0, W * 0.22, 40, 720);
  g1.addColorStop(0, rgba(ACC, 0.085 * energy));
  g1.addColorStop(1, "rgba(53,208,186,0)");
  ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H * 0.8);
  let g2 = ctx.createRadialGradient(W * 0.78, 90, 0, W * 0.78, 90, 720);
  g2.addColorStop(0, rgba(ACC2, 0.06 * energy));
  g2.addColorStop(1, "rgba(110,231,183,0)");
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H * 0.8);
  // 中央舞台光（随 energy 呼吸）
  const cx = W / 2, cy = H * 0.42;
  let g3 = ctx.createRadialGradient(cx, cy, 0, cx, cy, 640);
  g3.addColorStop(0, rgba(ACC, 0.05 * energy));
  g3.addColorStop(1, "rgba(53,208,186,0)");
  ctx.fillStyle = g3; ctx.fillRect(0, 0, W, H);
  // 微粒
  ctx.save();
  for (const p of PARTS) {
    const y = ((p.y - t * p.spd) % H + H) % H;
    const x = p.x + Math.sin(t * 0.3 + p.ph) * p.sway;
    const tw = 0.6 + 0.4 * Math.sin(t * 0.9 + p.ph * 3);
    ctx.globalAlpha = p.a * tw * energy;
    ctx.fillStyle = ACC2;
    ctx.beginPath();
    ctx.arc(x, y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  // 暗角
  let vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.95);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,0.38)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- 通用小部件 ---------- */
function kicker(str, cx, y, t, t0, alphaMul) {
  const r = rise(t, t0, 0.55);
  text(str, cx, y + r.dy, {
    size: 21, color: ACC, ls: 5, align: "center", alpha: r.alpha * (alphaMul || 1), weight: 500,
  });
}
function h2(str, cx, y, t, t0, alphaMul) {
  const r = rise(t, t0, 0.65);
  text(str, cx, y + r.dy, {
    size: 58, color: TEXT, font: "sans", weight: 800, align: "center",
    alpha: r.alpha * (alphaMul || 1), ls: -1,
  });
}
function subLine(str, cx, y, t, t0, alphaMul) {
  const r = rise(t, t0, 0.65);
  text(str, cx, y + r.dy, {
    size: 23, color: MUTED, font: "sans", align: "center", alpha: r.alpha * (alphaMul || 1),
  });
}

/* =====================================================================
 * 场景时间轴（绝对秒）
 *   BOOT     0    – 5.8    冷启动 systemctl
 *   HERO     5.2  – 15.6   标题 + pacman 终端
 *   FEATURES 15.2 – 28.2   六张特性卡
 *   CHANNELS 28.0 – 39.0   Matrix / QQ 对话
 *   INSTALL  38.6 – 47.0   三步安装
 *   STATS    46.8 – 52.8   数据
 *   OUTRO    52.4 – 57.0   落版
 * ===================================================================== */

/* ---------- S0 冷启动 ---------- */
function drawBoot(t) {
  const fade = 1 - eoCubic(seg(t, 4.9, 5.55));          // 整体淡出
  if (fade <= 0) return;
  const blockW = 860, x0 = W / 2 - blockW / 2, y0 = 452;
  const inA = seg(t, 0.45, 0.95);
  // 提示行 + 打字
  const cmd = "systemctl status dito --no-pager";
  const ps1W = segsWidth(PS1, 21, 400);
  drawSegs(PS1, x0, y0, 21, 400, fade * inA);
  const typedCmd = typedSegs([[TEXT, cmd]], t, 0.9, 2.55);
  const w1 = drawSegs(typedCmd, x0 + ps1W, y0, 21, 400, fade);
  const cmdDone = t > 2.55;
  if (t > 0.75 && (t < 2.55 || (cmdDone && caretOn(t) && t < 2.9)))
    drawCaret(x0 + ps1W + textWidth(cmd.slice(0, Math.floor(cmd.length * seg(t, 0.9, 2.55)))), y0, 24, t, fade * inA);
  // systemd 输出
  const lines = [
    { t: 2.85, segs: [[GREEN, "● "], [TEXT, "dito.service"], [DIM, " — "], [TEXT, "dito 蒂特 · 虚拟生命服务"]] },
    { t: 3.17, segs: [[DIM, "   Loaded: loaded ("], [TEXT, "/etc/systemd/system/dito.service"], [DIM, "; "], [ACC2, "enabled"], [DIM, ")"]] },
    { t: 3.49, segs: [[DIM, "   Active: "], [PR, "active (running)"], [DIM, " since boot"]] },
    { t: 3.81, segs: [[DIM, " Main PID: "], [TEXT, "1337"], [DIM, " (dito)"]] },
  ];
  let ly = y0 + 52;
  for (const L of lines) {
    const a = seg(t, L.t, L.t + 0.3) * fade;
    if (a > 0) drawSegs(L.segs, x0 + 24, ly, 20, 400, a);
    ly += 42;
  }
  // 末行光标常驻到淡出
  if (t > 4.0 && caretOn(t)) drawCaret(x0 + 24 + 330, ly - 42, 23, t, fade);
}

/* ---------- S1 HERO ---------- */
function drawHero(t) {
  // prompt 行
  {
    const r = rise(t, 0.15, 0.6);
    ctx.save();
    ctx.globalAlpha = r.alpha;
    drawSegs(PS1, W / 2 - 330 + 0, 168 + r.dy, 19, 400, 1);
    text("systemctl status dito --no-pager", W / 2 - 330 + 242, 168 + r.dy, { size: 19, color: MUTED });
    ctx.restore();
  }
  // 大标题 dito 蒂特
  {
    const r = rise(t, 0.0, 0.85);
    const cx = W / 2, base = 330 + r.dy;
    // 舞台光晕
    let g = ctx.createRadialGradient(cx, base - 60, 0, cx, base - 60, 560);
    g.addColorStop(0, rgba(ACC, 0.10 * r.alpha));
    g.addColorStop(1, "rgba(53,208,186,0)");
    ctx.fillStyle = g;
    ctx.fillRect(cx - 640, base - 620, 1280, 1180);
    const en = "dito", zh = "蒂特";
    const gap = 34;
    const wEn = textWidth(en, { size: 132, weight: 800, font: "sans" });
    const wZh = textWidth(zh, { size: 118, weight: 600, font: "sans" });
    const x0 = cx - (wEn + gap + wZh) / 2;
    text(en, x0, base, { size: 132, weight: 800, font: "sans", color: TEXT, ls: -2, alpha: r.alpha });
    text(zh, x0 + wEn + gap, base, { size: 118, weight: 600, font: "sans", color: ACC, alpha: r.alpha, glow: 30, glowAlpha: 0.35 });
  }
  // 副标题两行
  {
    const r = rise(t, 0.75, 0.65);
    text("跑在你电脑里的虚拟生命", W / 2, 408 + r.dy, { size: 30, weight: 600, font: "sans", color: TEXT, align: "center", alpha: r.alpha });
    const r2 = rise(t, 0.95, 0.65);
    text("常驻 Linux 桌面 · 接入 Matrix 与 QQ · 自带知识库、工具系统与一张不肯认输的嘴", W / 2, 456 + r2.dy, { size: 22, font: "sans", color: MUTED, align: "center", alpha: r2.alpha });
  }
  // 终端窗口
  const TW = 960, TH = 348, TX = W / 2 - TW / 2, TY = 560;
  {
    const r = rise(t, 1.85, 0.7);
    if (r.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = r.alpha;
    ctx.translate(0, r.dy);
    panel(TX, TY, TW, TH, 12, BG2, BORDER, { shadow: true, shadowBlur: 60, shadowAlpha: 0.5, shadowY: 22 });
    // 标题栏
    ctx.save();
    rr(TX, TY, TW, 48, 12);
    ctx.clip();
    ctx.fillStyle = PANEL;
    ctx.fillRect(TX, TY, TW, 48);
    ctx.restore();
    ctx.strokeStyle = BORDER;
    ctx.beginPath();
    ctx.moveTo(TX, TY + 48.5);
    ctx.lineTo(TX + TW, TY + 48.5);
    ctx.stroke();
    const dots = ["#ff5f57", "#febc2e", "#28c840"];
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = dots[i];
      ctx.beginPath();
      ctx.arc(TX + 30 + i * 26, TY + 24, 6.5, 0, Math.PI * 2);
      ctx.fill();
    }
    text("dito@arch — zsh", TX + 122, TY + 30, { size: 15, color: MUTED });
    // 终端内容
    const fx = TX + 30, fy0 = TY + 48 + 40, lh = 38, fs = 19.5;
    let ly = fy0;
    // 行1: sudo pacman -Syu dito（打字）
    const c1 = "sudo pacman -Syu dito";
    const pW1 = segsWidth(PS1, fs, 400);
    drawSegs(PS1, fx, ly, fs, 400, 1);
    const tp1 = typedSegs([[TEXT, c1]], t, 3.2, 4.7);
    const endX1 = drawSegs(tp1, fx + pW1, ly, fs, 400, 1);
    if (t >= 3.2 && t < 4.7) drawCaret(endX1, ly, 22, t, 1);
    ly += lh;
    if (t > 4.9) drawSegs([[ACC2, ":: 正在同步软件包数据库..."]], fx + 26, ly, fs, 400, seg(t, 4.9, 5.2));
    ly += lh;
    // 行3: 下载进度条
    if (t > 5.3) {
      const p = eoCubic(seg(t, 5.3, 5.95));
      const N = 22, fillN = Math.round(N * p);
      const bar = "#".repeat(fillN) + "-".repeat(N - fillN);
      const pct = String(Math.round(100 * p)).padStart(3, " ") + "%";
      const pre = " dito   3.1 KiB   412 KiB/s 00:00 ";
      drawSegs([[DIM, pre], [PR, "[" + bar + "]"], [TEXT, " " + pct]], fx + 26, ly, fs, 400, seg(t, 5.3, 5.55));
    }
    ly += lh;
    if (t > 6.25) drawSegs([[ACC2, "dito-0.2.0-1  >  dito-0.2.0-1"]], fx + 26, ly, fs, 400, seg(t, 6.25, 6.55));
    ly += lh;
    // 行5: dito --hello（打字）
    const c2 = "dito --hello";
    const pW2 = segsWidth(PS1, fs, 400);
    drawSegs(PS1, fx, ly, fs, 400, seg(t, 6.8, 7.0));
    const tp2 = typedSegs([[TEXT, c2]], t, 6.9, 7.9);
    const endX2 = drawSegs(tp2, fx + pW2, ly, fs, 400, 1);
    if (t >= 6.9 && t < 7.9) drawCaret(endX2, ly, 22, t, 1);
    ly += lh;
    // 行6: 蒂特的问候
    if (t > 8.2) {
      const a = seg(t, 8.2, 8.6);
      drawSegs([[ACC2, "早上好，主人。aicoy 在我腿上睡着了，桌面一切正常。"]], fx + 26, ly, fs, 400, a);
      if (t > 8.6 && caretOn(t)) {
        const w = textWidth("早上好，主人。aicoy 在我腿上睡着了，桌面一切正常。", { size: fs, weight: 400 });
        drawCaret(fx + 26 + w + 4, ly, 22, t, a);
      }
    }
    ctx.restore();
  }
}

/* ---------- 导航栏（HERO 起常驻） ---------- */
function drawNav(t) {
  const a = seg(t, 5.2, 5.9);
  if (a <= 0) return;
  const fadeAll = 1 - eoCubic(seg(t, 52.2, 52.7));
  const A = a * fadeAll;
  if (A <= 0) return;
  const y = 56;
  ctx.save();
  ctx.globalAlpha = A;
  // 底边框 + 半透明底
  ctx.fillStyle = "rgba(10,14,20,0.82)";
  ctx.fillRect(0, 0, W, 96);
  ctx.strokeStyle = BORDER;
  ctx.beginPath();
  ctx.moveTo(0, 96.5);
  ctx.lineTo(W, 96.5);
  ctx.stroke();
  // logo：>_ dito
  const lx = 150;
  text(">_", lx, y, { size: 24, color: ACC, weight: 700 });
  text("dito", lx + 44, y, { size: 24, color: TEXT, weight: 700 });
  if (caretOn(t)) ctx.fillRect(lx + 44 + textWidth("dito", { size: 24, weight: 700 }) + 6, y - 12, 9, 4);
  // 中间链接
  const links = ["特性", "安装", "数据"];
  const lw = links.map((s) => textWidth(s, { size: 19, font: "sans" }));
  const gap = 56;
  const totalW = lw.reduce((a2, b) => a2 + b, 0) + gap * 2;
  let cx2 = W / 2 - totalW / 2;
  for (let i = 0; i < 3; i++) {
    text(links[i], cx2, y, { size: 19, color: MUTED, font: "sans" });
    cx2 += lw[i] + gap;
  }
  // 版本徽标
  const v = "v0.2.0";
  const vw = textWidth(v, { size: 16 }) + 36;
  ctx.strokeStyle = BORDER;
  rr(W - 150 - vw, y - 24, vw, 40, 20);
  ctx.stroke();
  ctx.fillStyle = PANEL;
  rr(W - 150 - vw, y - 24, vw, 40, 20);
  ctx.fill();
  ctx.fillStyle = PANEL; // 重画底色避免边线内透明
  rr(W - 150 - vw + 1, y - 23, vw - 2, 38, 19);
  ctx.fill();
  text(v, W - 150 - vw / 2, y + 2, { size: 16, color: ACC2, align: "center" });
  ctx.restore();
}

/* ---------- S2 FEATURES ---------- */
const CARDS = [
  { h: "> E2EE Matrix Bot", body: ["基于 matrix-bot-sdk 的端到端加密机器人", "megolm 会话加密 · cross-signing 设备验证", "密文进，密文出"] },
  { h: "> QQ 全功能接入", body: ["SnowLuma 协议适配：群消息、群管理、相册", "闪传、空间、点外卖", "能干的活一样不少"] },
  { h: "> 本地知识库", body: ["SQLite 存储，思源笔记内容一键导入", "检索优先走知识库", "回答有据可查，不瞎编"] },
  { h: "> 工具与技能系统", body: ["bash 执行、文件读写、联网搜索", "AUR 包红绿灯安全审查、MCP 协议扩展", "按需调用"] },
  { h: "> Arch 原生分发", body: ["标准 pacman 包 + 签名仓库", "pacman -Syu 一条命令装好", "升级走滚动更新"] },
  { h: "> 极简部署", body: ["esbuild 打包成单文件 bundle", "native 模块随包携带", "没有依赖地狱，解压即活"] },
];
function drawFeatures(t) {
  kicker("// FEATURES", W / 2, 226, t, 0.05);
  h2("一台电脑，一个生命", W / 2, 300, t, 0.2);
  subLine("不是套壳聊天框，是一整套跑在本地的助手工程", W / 2, 348, t, 0.38);
  const CW = 560, CH = 196, GAP = 24;
  const MX = (W - (CW * 3 + GAP * 2)) / 2;
  const rowsY = [432, 432 + CH + GAP];
  for (let i = 0; i < 6; i++) {
    const col = i % 3, row = (i / 3) | 0;
    const x = MX + col * (CW + GAP), y = rowsY[row];
    const r = rise(t, 0.85 + i * 0.26, 0.6);
    if (r.alpha <= 0) continue;
    ctx.save();
    ctx.globalAlpha = r.alpha;
    ctx.translate(0, r.dy);
    // 入场边框闪光 → 回落为普通描边
    const flash = 1 - eoCubic(seg(t, 0.85 + i * 0.26 + 0.25, 0.85 + i * 0.26 + 1.15));
    const borderCol = mix(BORDER, ACC, 0.55 * flash);
    panel(x, y, CW, CH, 14, PANEL, borderCol);
    text(CARDS[i].h, x + 32, y + 58, { size: 25, color: ACC, weight: 500 });
    for (let j = 0; j < CARDS[i].body.length; j++) {
      text(CARDS[i].body[j], x + 32, y + 104 + j * 30, { size: 18.5, color: MUTED, font: "sans" });
    }
    ctx.restore();
  }
}

/* ---------- S3 CHANNELS ---------- */
function bubble(x, y, w, h, align, t, t0, opts) {
  opts = opts || {};
  const r = rise(t, t0, 0.45);
  if (r.alpha <= 0) return null;
  const bx = align === "right" ? x - w : x;
  ctx.save();
  ctx.globalAlpha = r.alpha;
  ctx.translate(0, r.dy);
  panel(bx, y, w, h, 12, opts.bg || "#1c2736", opts.border || null);
  ctx.restore();
  return r.alpha;
}
function typingDots(x, y, t, t0, t1, align) {
  const a = seg(t, t0, t0 + 0.2) * (1 - seg(t, t1 - 0.12, t1));
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a * 0.9;
  const w = 74, bx = align === "right" ? x - w : x;
  panel(bx, y, w, 44, 10, "#1c2736");
  for (let i = 0; i < 3; i++) {
    const dy = Math.sin((t - t0) * 7 - i * 0.7) * 3.2;
    ctx.fillStyle = ACC2;
    ctx.globalAlpha = a * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin((t - t0) * 7 - i * 0.7)));
    ctx.beginPath();
    ctx.arc(bx + 20 + i * 17, y + 22 + dy, 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}
function avatar(cx, cy, ch, bgCol, fgCol, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = bgCol;
  ctx.beginPath();
  ctx.arc(cx, cy, 22, 0, Math.PI * 2);
  ctx.fill();
  text(ch, cx, cy + 8, { size: 20, color: fgCol, align: "center", weight: 700, font: "sans" });
  ctx.restore();
}
function drawChannels(t) {
  kicker("// CHANNELS", W / 2, 226, t, 0.05);
  h2("哪里都有她", W / 2, 300, t, 0.2);
  subLine("密文进密文出的 Matrix，热热闹闹的 QQ 群", W / 2, 348, t, 0.38);
  const PW = 800, PH = 596, PY = 414;
  const LX = W / 2 - PW - 30, RX = W / 2 + 30;
  const floatL = Math.sin(t * 0.8) * 4, floatR = Math.sin(t * 0.8 + 1.4) * 4;
  // ---- 左：Matrix ----
  {
    const r = rise(t, 0.65, 0.6);
    if (r.alpha > 0) {
      ctx.save();
      ctx.globalAlpha = r.alpha;
      ctx.translate(0, r.dy + floatL);
      panel(LX, PY, PW, PH, 16, PANEL, BORDER, { shadow: true, shadowBlur: 46, shadowAlpha: 0.4, shadowY: 16 });
      text("> matrix · E2EE", LX + 30, PY + 52, { size: 23, color: ACC, weight: 500 });
      text("megolm · cross-signing", LX + PW - 30, PY + 52, { size: 16, color: DIM, align: "right" });
      // 小锁
      const kx = LX + 30 + textWidth("> matrix · E2EE", { size: 23, weight: 500 }) + 18, ky = PY + 45;
      ctx.strokeStyle = ACC2; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(kx + 8, ky + 2, 5.5, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = ACC2;
      rr(kx, ky + 2, 16, 12, 2.5); ctx.fill();
      ctx.strokeStyle = BORDER;
      ctx.beginPath(); ctx.moveTo(LX + 1, PY + 74.5); ctx.lineTo(LX + PW - 1, PY + 74.5); ctx.stroke();
      // 对话
      const chatX = LX + 40, innerW = PW - 80;
      // M1 用户（右）
      const m1 = "帮我把思源笔记同步进知识库";
      const m1w = textWidth(m1, { size: 20, font: "sans" }) + 48;
      const a1 = bubble(chatX + innerW, PY + 108, m1w, 56, "right", t, 1.9);
      if (a1 != null) text(m1, chatX + innerW - m1w + 24, PY + 143, { size: 20, font: "sans", color: TEXT, alpha: a1 });
      // M2 蒂特（左）
      const m2 = ["已导入 27 条笔记。检索优先走知识库，", "密文进，密文出，中间谁也看不到。"];
      const m2w = Math.max(...m2.map((s) => textWidth(s, { size: 20, font: "sans" }))) + 48;
      typingDots(chatX, PY + 186, t, 2.35, 2.95, "left");
      const a2 = bubble(chatX, PY + 186, m2w, 92, "left", t, 2.95, { bg: "rgba(53,208,186,0.09)", border: "rgba(53,208,186,0.35)" });
      if (a2 != null) {
        text("dito", chatX + 4, PY + 178, { size: 14, color: DIM });
        for (let j = 0; j < 2; j++) text(m2[j], chatX + 24, PY + 222 + j * 32, { size: 20, font: "sans", color: TEXT, alpha: a2 });
      }
      // M3 用户（右）
      const m3 = "牛啊。晚安";
      const m3w = textWidth(m3, { size: 20, font: "sans" }) + 48;
      const a3 = bubble(chatX + innerW, PY + 306, m3w, 56, "right", t, 6.5);
      if (a3 != null) text(m3, chatX + innerW - m3w + 24, PY + 341, { size: 20, font: "sans", color: TEXT, alpha: a3 });
      // M4 蒂特（左）
      const m4 = ["晚安，主人。", "有猫，有冰淇淋，有可口可乐。"];
      const m4w = Math.max(...m4.map((s) => textWidth(s, { size: 20, font: "sans" }))) + 48;
      typingDots(chatX, PY + 384, t, 6.95, 7.55, "left");
      const a4 = bubble(chatX, PY + 384, m4w, 92, "left", t, 7.55, { bg: "rgba(53,208,186,0.09)", border: "rgba(53,208,186,0.35)" });
      if (a4 != null) {
        text("dito", chatX + 4, PY + 376, { size: 14, color: DIM });
        for (let j = 0; j < 2; j++) text(m4[j], chatX + 24, PY + 420 + j * 32, { size: 20, font: "sans", color: TEXT, alpha: a4 });
      }
      ctx.restore();
    }
  }
  // ---- 右：QQ ----
  {
    const r = rise(t, 0.85, 0.6);
    if (r.alpha > 0) {
      ctx.save();
      ctx.globalAlpha = r.alpha;
      ctx.translate(0, r.dy + floatR);
      panel(RX, PY, PW, PH, 16, PANEL, BORDER, { shadow: true, shadowBlur: 46, shadowAlpha: 0.4, shadowY: 16 });
      text("> QQ 群 · SnowLuma", RX + 30, PY + 52, { size: 23, color: ACC, weight: 500 });
      text("群消息 · 相册 · 空间", RX + PW - 30, PY + 52, { size: 16, color: DIM, align: "right" });
      ctx.strokeStyle = BORDER;
      ctx.beginPath(); ctx.moveTo(RX + 1, PY + 74.5); ctx.lineTo(RX + PW - 1, PY + 74.5); ctx.stroke();
      const chatX = RX + 40, innerW = PW - 80;
      // Q1 群友（左，带头像）
      const q1 = "@蒂特 AUR 的 yt-dlp 能升吗";
      const q1w = textWidth(q1, { size: 20, font: "sans" }) + 48 + 60;
      avatar(chatX + 22, PY + 136, "友", "#232f40", MUTED, seg(t, 3.7, 3.95));
      const a1 = bubble(chatX + 60, PY + 108, q1w - 60, 56, "left", t, 3.85);
      if (a1 != null) text(q1, chatX + 84, PY + 143, { size: 20, font: "sans", color: TEXT, alpha: a1 });
      // Q2 蒂特（左）
      const q2 = ["有新版。红绿灯安全审查通过，", "已经帮你升好了。"];
      const q2w = Math.max(...q2.map((s) => textWidth(s, { size: 20, font: "sans" }))) + 48;
      typingDots(chatX + 60, PY + 186, t, 4.35, 4.95, "left");
      avatar(chatX + 22, PY + 214, "d", "rgba(53,208,186,0.16)", ACC, seg(t, 4.8, 5.05));
      const a2 = bubble(chatX + 60, PY + 186, q2w, 92, "left", t, 4.95, { bg: "rgba(53,208,186,0.09)", border: "rgba(53,208,186,0.35)" });
      if (a2 != null) {
        text("dito", chatX + 64, PY + 178, { size: 14, color: DIM });
        for (let j = 0; j < 2; j++) text(q2[j], chatX + 84, PY + 222 + j * 32, { size: 20, font: "sans", color: TEXT, alpha: a2 });
      }
      // Q3 群友（左）
      const q3 = "蒂特牛逼";
      const q3w = textWidth(q3, { size: 20, font: "sans" }) + 48;
      avatar(chatX + 22, PY + 334, "友", "#232f40", MUTED, seg(t, 6.3, 6.55));
      const a3 = bubble(chatX + 60, PY + 306, q3w, 56, "left", t, 6.45);
      if (a3 != null) text(q3, chatX + 84, PY + 341, { size: 20, font: "sans", color: TEXT, alpha: a3 });
      ctx.restore();
    }
  }
}

/* ---------- S4 INSTALL ---------- */
function drawInstall(t) {
  kicker("// INSTALL", W / 2, 226, t, 0.05);
  h2("三步，把她带回家", W / 2, 300, t, 0.2);
  subLine("仅支持 Arch Linux 及衍生发行版", W / 2, 348, t, 0.38);
  const BW = 1060, BX = W / 2 - BW / 2, BY = 414, BH = 592;
  const r = rise(t, 0.6, 0.65);
  if (r.alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = r.alpha;
  ctx.translate(0, r.dy);
  panel(BX, BY, BW, BH, 16, BG2, BORDER, { shadow: true, shadowBlur: 46, shadowAlpha: 0.4, shadowY: 16 });
  const stepX = BX + 44, codeW = BW - 88;
  const steps = [
    {
      label: "STEP 1 — 添加仓库", labelT: 1.4,
      typeT: [1.7, 3.1],
      lines: [
        { segs: [[DIM, "# /etc/pacman.conf 追加："]] },
        { segs: [[RED, "[dito]"]] },
        { segs: [[TEXT, "Server = "], [PR, "https://repo.dito.asia/x86_64"]] },
      ],
    },
    {
      label: "STEP 2 — 信任签名密钥", labelT: 3.5,
      typeT: [3.8, 5.5],
      lines: [
        { segs: [[TEXT, "curl -fsSL "], [PR, "https://repo.dito.asia/x86_64/dito-repo.pub"], [TEXT, " |"]] },
        { segs: [[TEXT, "  sudo pacman-key --add -"]] },
        { segs: [[TEXT, "sudo pacman-key --lsign-key "], [PR, "262B11C4D6F45E2EE914999CF132572A3B033D42"]] },
      ],
    },
    {
      label: "STEP 3 — 安装", labelT: 5.9,
      typeT: [6.2, 7.2],
      lines: [
        { segs: [[TEXT, "sudo pacman -Syu dito"]] },
        { segs: [[DIM, "# 按提示配置环境变量后启动"]] },
      ],
    },
  ];
  let y = BY + 40;
  for (const st of steps) {
    const ra = seg(t, st.labelT, st.labelT + 0.3);
    if (ra > 0) text(st.label, stepX, y + 20, { size: 18, color: ACC, ls: 1.5, alpha: ra });
    y += 42;
    // 代码块：总字符数按比例出字
    const flat = [];
    for (const L of st.lines) flat.push(L.segs);
    const total = flat.reduce((n, L) => n + L.reduce((m, s) => m + s[1].length, 0), 0);
    const nChars = Math.floor(total * seg(t, st.typeT[0], st.typeT[1]) + 1e-6);
    const codeH = st.lines.length * 34 + 30;
    panel(stepX, y, codeW, codeH, 10, "#070b10", null);
    let cy = y + 36;
    let left = nChars;
    for (const L of flat) {
      const shown = [];
      let need = left;
      for (const [c, s] of L) {
        if (need <= 0) break;
        shown.push([c, s.slice(0, Math.min(s.length, need))]);
        need -= Math.min(s.length, need);
      }
      left -= L.reduce((m, s) => m + s[1].length, 0);
      if (shown.length) drawSegs(shown, stepX + 26, cy, 18.5, 400, 1);
      cy += 34;
    }
    if (nChars > 0 && nChars < total && caretOn(t)) {
      // 光标跟在正在出的字后面（简化：行末）
      let lx = stepX + 26, cur = nChars;
      for (const L of flat) {
        const len = L.reduce((m, s) => m + s[1].length, 0);
        if (cur <= len) {
          let w = 0, need = cur;
          for (const [c, s] of L) { const take = Math.min(s.length, need); w += textWidth(s.slice(0, take), { size: 18.5, weight: 400 }); need -= take; if (need <= 0) break; }
          lx += w;
          break;
        }
        cur -= len;
      }
      let rowIdx = 0, c2 = nChars;
      for (let i = 0; i < flat.length; i++) { const len = flat[i].reduce((m, s) => m + s[1].length, 0); if (c2 <= len) { rowIdx = i; break; } c2 -= len; }
      drawCaret(lx, y + 36 + rowIdx * 34, 20, t, 1);
    }
    y += codeH + 26;
  }
  ctx.restore();
}

/* ---------- S5 STATS ---------- */
const FACTS = [
  { n: 173, label: "知识库条目" },
  { n: 13, suffix: " MB", label: "单文件 bundle" },
  { n: 2, label: "接入平台" },
  { n: 18, label: "永远十八岁" },
];
function drawStats(t) {
  kicker("// STATS", W / 2, 250, t, 0.05);
  h2("目前的她", W / 2, 330, t, 0.2);
  const p = eoCubic(seg(t, 0.9, 2.5));
  for (let i = 0; i < 4; i++) {
    const r = rise(t, 0.75 + i * 0.2, 0.6);
    if (r.alpha <= 0) continue;
    const cx = W / 2 + (i - 1.5) * 400;
    ctx.save();
    ctx.globalAlpha = r.alpha;
    ctx.translate(0, r.dy);
    const f = FACTS[i];
    const val = Math.round(f.n * p);
    const str = String(val) + (f.suffix || "");
    text(str, cx, 570, { size: 76, color: ACC, weight: 700, align: "center", glow: 26, glowAlpha: 0.3 });
    text(f.label, cx, 622, { size: 21, color: MUTED, font: "sans", align: "center" });
    ctx.restore();
  }
}

/* ---------- S6 OUTRO ---------- */
function drawOutro(t) {
  {
    const r = rise(t, 0.15, 0.8);
    const en = ">_ dito", zh = "蒂特";
    const enW = textWidth(en, { size: 92, weight: 800, font: "sans" });
    const zhW = textWidth(zh, { size: 82, weight: 600, font: "sans" });
    const gap = 26;
    const x0 = W / 2 - (enW + gap + zhW + 40) / 2;
    let g = ctx.createRadialGradient(W / 2, 470, 0, W / 2, 470, 620);
    g.addColorStop(0, rgba(ACC, 0.09 * r.alpha));
    g.addColorStop(1, "rgba(53,208,186,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    text(zh, x0 + enW + gap, 500 + r.dy, { size: 82, weight: 600, font: "sans", color: ACC, alpha: r.alpha, glow: 28, glowAlpha: 0.35 });
    if (t > 0.95 && caretOn(t)) {
      ctx.save();
      ctx.globalAlpha = r.alpha;
      ctx.fillStyle = ACC;
      ctx.fillRect(x0 + enW + gap + zhW + 22, 500 + r.dy - 62, 26, 66);

  {
    const r = rise(t, 0.9, 0.6);

  }
  {
    const r = rise(t, 1.3, 0.6);
    text("dito.dito.asia", W / 2, 668 + r.dy, { size: 34, color: ACC2, weight: 700, align: "center", alpha: r.alpha, glow: 22, glowAlpha: 0.3 });
  }
  {
    const r = rise(t, 1.6, 0.6);
    text("powered by Arch Linux · created by yuanjingINT", W / 2, 718 + r.dy, { size: 20, color: MUTED, font: "sans", align: "center", alpha: r.alpha });
  }
  {
    const r = rise(t, 1.9, 0.6);
    text("© 2026 · 有猫，有冰淇淋，有可口可乐", W / 2, 762 + r.dy, { size: 18, color: DIM, font: "sans", align: "center", alpha: r.alpha });
  }
}

/* =====================================================================
 * 主渲染循环
 * ===================================================================== */
const SCENES = [
  { a: 0.0, b: 5.8, draw: drawBoot },
  { a: 5.2, b: 15.6, draw: drawHero },
  { a: 15.2, b: 28.2, draw: drawFeatures },
  { a: 28.0, b: 39.0, draw: drawChannels },
  { a: 38.6, b: 47.0, draw: drawInstall },
  { a: 46.8, b: 52.8, draw: drawStats },
  { a: 52.4, b: DUR, draw: drawOutro },
];
function render(t) {
  // 背景能量：随场景呼吸，结尾抬升
  let energy = 0.75 + 0.25 * Math.sin(t * 0.45);
  if (t < 1.4) energy *= seg(t, 0.1, 1.4);
  if (t > 52.4) energy *= 1.25;
  drawBackground(t, energy);
  for (const s of SCENES) {
    if (t < s.a - 0.001 || t > s.b + 0.001) continue;
    const lt = t - s.a;
    const exitP = eoCubic(seg(t, s.b - 0.6, s.b));
    ctx.save();
    ctx.globalAlpha = 1 - exitP;
    if (exitP > 0) ctx.translate(0, -22 * exitP);
    s.draw(lt);
    ctx.restore();
  }
  // 结尾黑场
  const black = seg(t, DUR - 1.0, DUR - 0.05);
  if (black > 0) {
    ctx.fillStyle = `rgba(0,0,0,${black})`;
    ctx.fillRect(0, 0, W, H);
  }
  // 开头淡入
  const fadeIn = seg(t, 0, 0.35);
  if (fadeIn < 1) {
    ctx.fillStyle = `rgba(0,0,0,${1 - fadeIn})`;
    ctx.fillRect(0, 0, W, H);
  }
}
window.__render = render;
window.__ready = (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => true);

/* 单帧调试：?t=9.5 */
const qs = new URLSearchParams(location.search);
if (qs.has("t")) {
  render(parseFloat(qs.get("t")) || 0);
}
